<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>wycca</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: dark }
    * { box-sizing: border-box }
    html, body { height: 100%; margin: 0; background: #0e1116; color: #e8e6e1; font: 14px/1.4 system-ui, sans-serif }
    #stage, #stage svg { width: 100%; height: 100%; display: block }
    #gear {
      position: fixed; top: 8px; right: 8px; z-index: 2; font-size: 20px; padding: 0 8px;
      border: 1px solid #39404d; border-radius: 8px; background: #14181f; color: inherit;
      cursor: pointer; opacity: .5
    }
    #gear:hover { opacity: 1 }
    #panel {
      position: fixed; inset: 0 0 0 auto; z-index: 1; width: min(430px, 100%);
      overflow: auto; padding: 44px 12px 24px;
      background: #14181f; border-left: 1px solid #39404d; display: none
    }
    #panel.open { display: block }
    details { border: 1px solid #2c323d; border-radius: 8px; margin: 0 0 8px; padding: 6px 8px }
    summary { cursor: pointer; color: #ff9f1c; font-weight: 600 }
    summary::marker { content: "" }
    details[open] > summary { margin-bottom: 4px }
    .row { display: grid; grid-template-columns: 9.5em 1fr; gap: 6px; align-items: center; margin: 3px 0 }
    .row > label { color: #9aa4b2 }
    .ctl { display: flex; gap: 6px; align-items: center; min-width: 0 }
    .ctl input[type=number] { width: 5.5em }
    .ctl input[type=text] { flex: 1; min-width: 0 }
    .ctl input[type=range] { flex: 1; min-width: 3em }
    input, select { background: #0e1116; color: inherit; border: 1px solid #39404d; border-radius: 4px; padding: 2px 4px; font: inherit }
    input[type=checkbox] { width: 16px; height: 16px; padding: 0; accent-color: #ff9f1c; flex: none }
    .ring { border-left: 3px solid #4cc9f0; padding: 4px 0 4px 8px; margin: 6px 0 }
    .ringhead { display: flex; gap: 6px; align-items: center }
    .ringhead::before { content: "▸"; color: #4cc9f0 }
    .ring[open] > .ringhead::before { content: "▾" }
    .ringtitle { font-weight: 600; color: #4cc9f0; min-width: 52px }
    /* Layers are the ring, so they are always on show: no folding here. */
    .layers { margin: 4px 0 4px 4px; padding-left: 6px; border-left: 1px dashed #2c323d }
    .layer { margin: 6px 0 }
    .layerhead { display: flex; gap: 6px; align-items: center; margin-bottom: 2px }
    .layertitle { font-weight: 600; color: #ff9f1c; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .ctl input[type=text] { width: 7em }
    .auto { display: flex; gap: 3px; align-items: center; color: #9aa4b2; font-size: 12px }
    button { border: 1px solid #39404d; border-radius: 4px; background: #0e1116; color: inherit; cursor: pointer; font: inherit; padding: 1px 7px }
    #boot { margin: 2em; color: #e63946 }
  </style>
</head>

<body>
  <main id="stage"></main>
  <button id="gear" title="settings" onclick="document.getElementById('panel').classList.toggle('open')">⚙</button>
  <aside id="panel"></aside>
  <p id="boot"></p>

  <script src="wycca.wasm.js"></script>
  <script src="ui.js"></script>
</body>

</html>

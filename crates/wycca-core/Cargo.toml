[package]
name = "wycca-core"
description = "Circular calendar renderer: config -> geometry -> SVG. No I/O, no clock."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` is what the browser loads; `rlib` is what everything else links.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }